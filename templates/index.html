<!DOCTYPE html>
<html>
<head>
    <title>Fake News Detector</title>

    <style>
        body{
            font-family: Arial;
            background:#1e293b;
            color:white;
            text-align:center;
            padding-top:100px;
        }

        input{
            width:60%;
            padding:15px;
            border-radius:10px;
            border:none;
            font-size:16px;
        }

        button{
            padding:15px 25px;
            border:none;
            border-radius:10px;
            background:#2563eb;
            color:white;
            font-size:16px;
            cursor:pointer;
        }

        button:hover{
            background:#1d4ed8;
        }

        .result{
            margin-top:30px;
            font-size:28px;
            font-weight:bold;
        }
    </style>

</head>
<body>

    <h1>📰 Fake News Detector</h1>

    <form action="/predict" method="post">

        <input type="text"
               name="news"
               placeholder="Enter any news here..."
               required>

        <br><br>

        <button type="submit">
            Check News
        </button>

    </form>

    {% if prediction %}
        <div class="result">
            {{ prediction }}
        </div>
    {% endif %}

</body>
</html>
